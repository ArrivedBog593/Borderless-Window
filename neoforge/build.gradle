plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
            // run/<minecraft>/<loader>/<side>, as in the other projects plus
            // the loader: run/ is not in git, so every branch shares it, and
            // versions and loaders must never mix mods or worlds.
            gameDirectory = rootProject.file("run/${minecraft_version}/neoforge/client")
        }

        // A dedicated server to join from the client run: notices that only
        // a real server sends (unverified chat, server resource packs), and
        // the check that the client-only mod does not break a server. The
        // client run has no account, so server.properties needs
        // online-mode=false; a server in offline mode never enforces secure
        // chat (DedicatedServer.enforceSecureProfile).
        server {
            server()
            programArgument '--nogui'
            gameDirectory = rootProject.file("run/${minecraft_version}/neoforge/server")
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodium_api_version}"
}

// Regenerates neoforge.mods.toml on every IDE sync, as the MDK does.
neoForge.ideSyncTask tasks.named('generateModMetadata')

// The mcgradleconventions loader attribute (see common/build.gradle).
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
