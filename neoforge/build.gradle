plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
            // run/<minecraft>/<loader>/<side>, as in the other projects plus
            // the loader: run/ is not in git, so every branch shares it, and
            // versions and loaders must never mix mods or worlds.
            gameDirectory = rootProject.file("run/${minecraft_version}/neoforge/client")
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodium_api_version}"
}

// Regenerates neoforge.mods.toml on every IDE sync, as the MDK does.
neoForge.ideSyncTask tasks.named('generateModMetadata')
