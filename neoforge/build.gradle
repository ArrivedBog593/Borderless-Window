plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            // run/<minecraft>/<loader>/<side>, as in the other projects plus
            // the loader: run/ is not in git, so every branch shares it, and
            // versions and loaders must never mix mods or worlds.
            gameDirectory = rootProject.file("run/${minecraft_version}/neoforge/client")
            // Running from the IDE checks every draw against what its
            // pipeline declares, and Iris's shader pipelines leave some
            // samplers unbound: with a shaderpack on, the game crashes
            // ("Missing sampler" in GlCommandEncoder.trySetup). The check
            // never runs outside the IDE.
            systemProperty 'neoforge.disableGlValidation', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodium_api_version}"
}

// Regenerates neoforge.mods.toml on every IDE sync, as the MDK does.
neoForge.ideSyncTask tasks.named('generateModMetadata')
