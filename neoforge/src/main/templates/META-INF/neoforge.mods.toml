modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ArrivedBog593/Borderless-Window/issues"
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ArrivedBog593/Borderless-Window"
# Since 26.2 the mod list shows an icon beside the name in the list and a
# banner above the details (logoFile, now deprecated, was only the
# banner). The square icon serves as both.
iconFile="assets/${mod_id}/icon.png"
bannerFile="assets/${mod_id}/icon.png"
# Pixel-art icon: keep it crisp when NeoForge scales it (the banner is
# never blurred).
iconBlur=false
authors="${mod_authors}"
description='''${mod_description}'''
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sodium"
type="optional"
versionRange="[0.9.0,)"
ordering="AFTER"
side="CLIENT"