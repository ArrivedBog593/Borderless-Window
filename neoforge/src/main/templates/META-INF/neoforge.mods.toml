license="${mod_license}"
issueTrackerURL="https://github.com/ArrivedBog593/Borderless-Window/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ArrivedBog593/Borderless-Window"
# Since 26.2 the mod list shows an icon beside the name in the list and a
# banner above the details (logoFile, now deprecated, was only the
# banner). The square icon serves as both.
iconFile="assets/${mod_id}/icon.png"
bannerFile="assets/${mod_id}/icon.png"
# Pixel-art icon: keep it crisp when NeoForge scales it (the banner is
# never blurred).
iconBlur=false
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sodium"
type="optional"
versionRange="[0.9.0,)"
ordering="AFTER"
side="CLIENT"

# Chloride requires Sodium and, like this mod, replaces Sodium's Fullscreen
# option through its Config API: Sodium refuses two replacements for the
# same option and the game crashes at the title screen ("Multiple
# overrides for option 'sodium:general.fullscreen'", tested 2026-11-23
# on 1.21.1 with Chloride 1.8.1 and Sodium 0.8.13, and declared on every
# version both mods exist for). It also takes over F11 and the
# window mode switch (Window.setMode). Declaring it here turns the crash
# into a clear message before loading.
[[dependencies.${mod_id}]]
modId="chloride"
type="incompatible"
reason="Chloride and Borderless Window both replace Sodium's Fullscreen option with their own screen mode and both take over F11; together the game crashes on startup. Keep only one of the two."
versionRange="[0,)"
ordering="NONE"
side="CLIENT"
