// Applied by each loader module. Compiles common/'s sources and resources
// into the loader's own jar: a mod ships as one jar per loader, with the
// shared code inside it rather than beside it.
plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Lets the IDE see common/'s classes from the loader module. The
    // build itself compiles the sources below, not this jar.
    compileOnly project(':common')
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('processResources', ProcessResources) {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Fills ${...} in the loader's metadata file (src/main/templates) into a
// generated resources folder. A task of its own rather than a filter on
// processResources: IntelliJ cannot model resource filtering, and warns
// about it, but sees a generated folder as plain resources. Only
// properties this branch defines are offered, so a typo in the template
// fails the build instead of silently expanding to nothing.
def expandProps = ['mod_id', 'mod_name', 'mod_version', 'mod_license', 'mod_authors',
                   'mod_description', 'minecraft_version', 'minecraft_version_range',
                   'neo_version', 'neo_version_range', 'loader_version_range',
                   'fabric_loader_requirement', 'java_version']
        .findAll { project.hasProperty(it) }
        .collectEntries { [(it): project.property(it)] }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties(expandProps)
    expand expandProps
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir(generateModMetadata)
