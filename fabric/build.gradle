plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // No Fabric API as a dependency: the mod hooks fog, the screen overlays
    // and the HUD with its own mixins. The exceptions are assets and the
    // zoom key. Assets first: Fabric
    // Loader alone never loads a mod's assets/ (lang files...), Fabric
    // API's resource loader does. Bundled jar-in-jar with its base module,
    // as Sodium does, so players still install nothing; with Fabric API
    // present, the loader picks the newer copy of each module.
    include(modImplementation(fabricApi.module('fabric-api-base', fabric_api_version)))
    include(modImplementation(fabricApi.module('fabric-resource-loader-v1', fabric_api_version)))
    // Same deal for the zoom key: Fabric Loader has no way to add a key to
    // Controls (nor to give it a category of its own), the key binding
    // module does.
    include(modImplementation(fabricApi.module('fabric-key-binding-api-v1', fabric_api_version)))

    // Optional integrations, compiled against only. To test them, drop the
    // regular jars into the run's mods/ folder, as on NeoForge: Fabric
    // Loader remaps them on the fly in the dev environment.
    modCompileOnly "net.caffeinemc:sodium-fabric-api:${sodium_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    // Iris works in this dev run from mods/ (tested with Iris 1.10.8 and
    // Fabric Loader 0.20.1). On 1.21.1 it did not: Fabric Loader's
    // development-only mixin remapper crashed on one of Iris's selectors
    // (a method name with no descriptor that it could not find).
}

// No refmap: Fabric runs on intermediary names outside the dev environment,
// and Loom 1.13 rewrites the mixin targets (common/'s too, compiled here)
// straight into the remapped classes instead.
loom {
    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated(true)
            // run/<minecraft>/<loader>/<side>; see neoforge/build.gradle.
            runDir("../run/${minecraft_version}/fabric/client")
            // A fixed name, as NeoForge's run has. Without it vanilla makes
            // one up on every launch ("Player" + 3 digits of the clock), so
            // each run is a different player in the same world.
            programArgs('--username', 'Dev')
        }
        // The mod is client-only: no IDE entry for a server run.
        server {
            ideConfigGenerated(false)
        }
    }
}
