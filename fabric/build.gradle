plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    // Unobfuscated since 26.1: no mappings, and mods are plain dependencies
    // (implementation/compileOnly, not modImplementation/modCompileOnly).
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // No Fabric API as a dependency: the mod hooks fog, the screen overlays
    // and the HUD with its own mixins. The exceptions are assets and the
    // zoom key. Assets first: Fabric
    // Loader alone never loads a mod's assets/ (lang files...), Fabric
    // API's resource loader does. Bundled jar-in-jar with its base module,
    // as Sodium does, so players still install nothing; with Fabric API
    // present, the loader picks the newer copy of each module.
    include(implementation(fabricApi.module('fabric-api-base', fabric_api_version)))
    include(implementation(fabricApi.module('fabric-resource-loader-v1', fabric_api_version)))
    // Same deal for the zoom key: Fabric Loader has no way to add a key to
    // Controls (nor to give it a category of its own), the key mapping
    // module does (fabric-key-binding-api-v1 until 1.21.11).
    include(implementation(fabricApi.module('fabric-key-mapping-api-v1', fabric_api_version)))

    // Optional integrations, compiled against only. To test them, drop the
    // regular jars into the run's mods/ folder, as on NeoForge.
    compileOnly "net.caffeinemc:sodium-fabric-api:${sodium_api_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

// No refmap and no remapping: Fabric runs on the same Mojang names the
// mixins are written in.
loom {
    runs {
        client {
            client()
            displayName = 'Fabric Client'
            generateRunConfig = true
            // run/<minecraft>/<loader>/<side>; see neoforge/build.gradle.
            runDirectory = file("../run/${minecraft_version}/fabric/client")
            // A fixed name, as NeoForge's run has. Without it vanilla makes
            // one up on every launch ("Player" + 3 digits of the clock), so
            // each run is a different player in the same world.
            programArguments.addAll('--username', 'Dev')
        }
        // The mod is client-only: no IDE entry for a server run.
        server {
            generateRunConfig = false
        }
    }
}
