// Shared by every module: common/ and each loader.
plugins {
    id 'java-library'
    id 'idea'
}

// The Minecraft version rides in the version, Sodium-style
// (borderlesswindow-neoforge-1.8.0+mc1.21.1.jar): every branch builds for a
// different one, and jars from two branches must never share a name.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-${project.name}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

// What Loom (fabric/) generates locally: the Minecraft jar
// (net.minecraft:minecraft-merged-<hash>) and, on 1.21.x, the layered
// mappings (loom:mappings) and the remapped mods (remapped.*). Gradle asks
// the remote repositories for them before Loom's local ones; a 404 lets it
// move on, but a 429 (Maven Central's rate limit, seen in Actions) failed
// the build. None of them is on Central (its old "loom" group is JBoss
// Loom, not Fabric's) or on Mojang's libraries server.
def skipLoomGenerated = { content ->
    content.excludeGroup('net.minecraft')
    content.excludeGroup('loom')
    content.excludeGroupAndSubgroups('remapped')
}

repositories {
    mavenCentral {
        content(skipLoomGenerated)
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CaffeineMC'
                url = 'https://maven.caffeinemc.net/releases'
            }
        }
        filter { includeGroup('net.caffeinemc') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fabric'
                url = 'https://maven.fabricmc.net'
            }
        }
        // Subgroups too: Fabric API lives in net.fabricmc.fabric-api.
        filter { includeGroupAndSubgroups('net.fabricmc') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = 'https://maven.terraformersmc.com/releases'
            }
        }
        filter { includeGroup('com.terraformersmc') }
    }
}

// Loom adds its own "Mojang" repository (libraries.minecraft.net) after
// this script runs; on 1.21.x it also looks for jars on Maven Central.
// Lazy, so it also covers modules and branches without one.
repositories.matching { it.name == 'Mojang' }.configureEach { repository ->
    repository.content(skipLoomGenerated)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Captured now: with the configuration cache on, the rename closure runs
// with no project to look mod_id up in.
def licenseSuffix = "_${mod_id}"
jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}${licenseSuffix}" }
    }
}

// IDEA no longer downloads sources/javadoc jars for dependencies on its own.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
