# Keeps the workflow actions current on its own. Without this, action versions
# silently rot until a runtime deprecation breaks a release.
#
# Dependabot reads this file from the default branch only. This repo has a
# single live branch (master), so one entry covers every workflow. If a port
# ever gets its own branch, it needs its own entry with target-branch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]
