name: Build

# One branch per Minecraft version (NeoFabric/1.21.1, NeoFabric/26.1.2...),
# each building every loader it supports. This file reads the versions from
# gradle.properties, so it is the same on every branch.
on:
  push:
    branches:
      - "NeoFabric/**"
      - "Fabric/**"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches:
      - "NeoFabric/**"
      - "Fabric/**"
  # Run by hand (Actions > Build > Run workflow) to publish what is already
  # pushed: an empty [curseforge] commit changes no files, so paths-ignore
  # skips it and nothing runs.
  workflow_dispatch:
    inputs:
      curseforge:
        description: "Publish to CurseForge as"
        type: choice
        options:
          - none
          - release
          - beta
          - alpha
        default: none

permissions:
  contents: read

# Actions are pinned by commit SHA, with the version in a comment: a tag can be
# moved to other code by whoever controls the action's repository, a commit
# cannot. Dependabot updates both together.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.gradle_props.outputs.mod_version }}
      minecraft_version: ${{ steps.gradle_props.outputs.minecraft_version }}
      java_version: ${{ steps.gradle_props.outputs.java_version }}
      loaders: ${{ steps.loaders.outputs.loaders }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read mod properties
        id: gradle_props
        run: |
          set -euo pipefail
          for key in mod_version minecraft_version java_version; do
            value=$(grep -E "^$key=" gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
            [ -n "$value" ] || { echo "$key not found in gradle.properties"; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
          # The Java Gradle itself runs on, which can be newer than the one
          # the jar is compiled for (Loom 1.19+ needs 25).
          daemon=$(grep -E "^toolchainVersion=" gradle/gradle-daemon-jvm.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "daemon_java_version=${daemon:-$(grep -E '^java_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')}" >> "$GITHUB_OUTPUT"

      # Both JDKs, read from the branch: the one the jar is compiled for
      # (java_version) and the one Gradle runs on. The last one listed
      # becomes JAVA_HOME, so gradlew starts on the daemon's; the Build step
      # points Gradle at the other. Without them, foojay downloads the right
      # JDK mid-build: it works, but it re-downloads every run and turns an
      # outage in someone else's service into a failed build.
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: |
            ${{ steps.gradle_props.outputs.java_version }}
            ${{ steps.gradle_props.outputs.daemon_java_version }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The loaders this branch builds are the loader modules it has, so a
      # Fabric-only branch (Fabric/1.20.1) needs no edit here.
      - name: Detect loaders
        id: loaders
        run: |
          set -euo pipefail
          loaders=()
          for loader in fabric neoforge; do
            [ -f "$loader/build.gradle" ] && loaders+=("\"$loader\"")
          done
          [ ${#loaders[@]} -gt 0 ] || { echo "No loader module found"; exit 1; }
          echo "loaders=[$(IFS=,; echo "${loaders[*]}")]" >> "$GITHUB_OUTPUT"

      # setup-java leaves each JDK in JAVA_HOME_<version>_X64, where Gradle
      # does not look for toolchains on its own.
      - name: Build
        env:
          JAVA: ${{ steps.gradle_props.outputs.java_version }}
        run: ./gradlew build "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_${JAVA}_X64"

      # Named exactly, like in release.yml: a glob would also pick up a
      # sources or javadoc jar the day the build starts producing one.
      - name: Collect jars
        env:
          MOD_VERSION: ${{ steps.gradle_props.outputs.mod_version }}
          MC: ${{ steps.gradle_props.outputs.minecraft_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for loader in fabric neoforge; do
            [ -f "$loader/build.gradle" ] || continue
            cp "$loader/build/libs/borderlesswindow-$loader-$MOD_VERSION+mc$MC.jar" dist/
          done
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: borderlesswindow-dev
          path: dist/*.jar
          retention-days: 14
          if-no-files-found: error

  # Publishes the jars to CurseForge only when the pushed commit message contains [curseforge], optionally with a
  # release type: [curseforge], [curseforge beta] or [curseforge alpha], or when the workflow is run by hand with a
  # release type other than none. One upload per loader. The changelog is the
  # English part of changelogs/changelog-<version>.md or, without it, the body of the commit message. Needs the
  # CURSEFORGE_TOKEN secret and the CURSEFORGE_PROJECT_ID variable of the repository. It is its own job so only it gets
  # write access.
  publish-curseforge:
    needs: build
    if: >-
      ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[curseforge'))
      || (github.event_name == 'workflow_dispatch' && inputs.curseforge != 'none') }}
    runs-on: ubuntu-latest
    # One publish per branch at a time: a push and a manual run together
    # would both pass the tag check before either pushed its tag, and upload
    # the same file twice. Queued, never cancelled: an upload cut midway is
    # worse than a second one that finds the tag and stops.
    concurrency:
      group: curseforge-${{ github.ref }}-${{ matrix.loader }}
      cancel-in-progress: false
    permissions:
      contents: write # needed to push the curseforge-* tags
    strategy:
      # Each loader uploads on its own: one failing must not cancel the other,
      # and a re-run then only uploads what is missing (see the tag check).
      fail-fast: false
      matrix:
        loader: ${{ fromJSON(needs.build.outputs.loaders) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: borderlesswindow-dev
          path: dist

      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_TYPE: ${{ inputs.curseforge }}
          MOD_VERSION: ${{ needs.build.outputs.mod_version }}
          MC: ${{ needs.build.outputs.minecraft_version }}
          JAVA: ${{ needs.build.outputs.java_version }}
          LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail
          : "${CURSEFORGE_TOKEN:?Add the CURSEFORGE_TOKEN secret to the repository}"
          : "${CURSEFORGE_PROJECT_ID:?Add the CURSEFORGE_PROJECT_ID variable to the repository}"

          # Each file states its own relations, so a loader never lists a mod that does not exist for it: Sodium is on
          # both, Mod Menu is Fabric-only, and nimueller's Borderless (Forge and NeoForge only) is marked incompatible
          # on NeoForge -- it uses the same mod ID, borderlesswindow, and with both jars NeoForge silently keeps the
          # one with the higher version string, which is theirs ("1.21.1-1.7.5_1" beats "1.11.0"): this mod is
          # dropped without an error. Mod metadata cannot tell the two apart, so this relation, which lets the
          # CurseForge app warn before they are installed together, is the only guard. Slug plus project ID, which
          # the Upload API takes for an exact match. The ID is a JSON number: as a string the API rejects the whole upload
          # (error 1002, "Expected Integer but got String"). Chloride (SrRapero720, Fabric, Forge and NeoForge) is
          # incompatible on both loaders: it also replaces Sodium's Fullscreen option and takes over F11, and with both
          # installed Sodium crashes at the title screen. The jar declares it too (neoforge.mods.toml, fabric.mod.json
          # "breaks"), so the loader refuses to start; this relation warns before the install. Keep the project's
          # Default Relations to what fits every loader (Sodium, Chloride): the API docs do not say whether defaults
          # get merged into files uploaded with their own relations.
          SODIUM='{"slug": "sodium", "projectID": 394468, "type": "optionalDependency"}'
          MODMENU='{"slug": "modmenu", "projectID": 308702, "type": "optionalDependency"}'
          BORDERLESS='{"slug": "borderless", "projectID": 378979, "type": "incompatible"}'
          CHLORIDE='{"slug": "chloride", "projectID": 931925, "type": "incompatible"}'
          case "$LOADER" in
            fabric)   LOADER_NAME=Fabric;   RELATIONS="[$SODIUM, $MODMENU, $CHLORIDE]" ;;
            neoforge) LOADER_NAME=NeoForge; RELATIONS="[$SODIUM, $BORDERLESS, $CHLORIDE]" ;;
            *) echo "Unknown loader $LOADER"; exit 1 ;;
          esac

          RELEASE_TYPE=release
          if [[ "$COMMIT_MESSAGE" =~ \[curseforge\ (alpha|beta|release)\] ]]; then RELEASE_TYPE="${BASH_REMATCH[1]}"; fi
          if [[ "$DISPATCH_TYPE" =~ ^(alpha|beta|release)$ ]]; then RELEASE_TYPE="$DISPATCH_TYPE"; fi

          # The English part of changelogs/changelog-<version>.md (from the first "## " heading up to the "---" or
          # <details> before the Spanish notes; CurseForge already shows the version and date), else the commit
          # message without its first line and without the [curseforge] markers, else a plain line
          CHANGELOG=""
          file="changelogs/changelog-$MOD_VERSION.md"
          if [ -f "$file" ]; then
            CHANGELOG=$(awk '/^---[[:space:]]*$/ || /^<details>/{ exit } /^## /{ found=1 } found' "$file")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(printf '%s\n' "$COMMIT_MESSAGE" | tail -n +2 | sed -E 's/\[curseforge[^]]*\]//g' | sed '/./,$!d')
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="Borderless Window $MOD_VERSION for $LOADER_NAME $MC."

          # A version that is already on CurseForge (marked with a tag, see the upload below) is not uploaded again.
          # The loader is part of the tag, so each loader's file is tracked on its own.
          tag="curseforge-$LOADER-$MC-$MOD_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$LOADER_NAME $MC $MOD_VERSION is already on CurseForge (tag $tag), not uploading it again"
            exit 0
          fi

          jar="dist/borderlesswindow-$LOADER-$MOD_VERSION+mc$MC.jar"
          # "Borderless Window 1.11.4 for NeoForge 1.21.1", as Sodium names its files: the mod version first, then
          # what it runs on. The loader and Minecraft version keep every name unique across branches, which upload
          # the same mod version each for its own Minecraft version.
          name="Borderless Window $MOD_VERSION for $LOADER_NAME $MC"

          # Client only: the mod has no server side, so "Server" is deliberately not listed. The Java tag comes from
          # java_version, so a branch on a newer Java (26.x needs 25) is tagged right without editing this file.
          metadata=$(jq -nc \
            --arg changelog "$CHANGELOG" \
            --arg type "$RELEASE_TYPE" \
            --arg name "$name" \
            --arg mc "$MC" \
            --arg loader "$LOADER_NAME" \
            --arg java "Java $JAVA" \
            --argjson relations "$RELATIONS" \
            '{changelog: $changelog, changelogType: "markdown", releaseType: $type, displayName: $name,
              gameVersionNames: [$mc, $java, $loader, "Client"],
              relations: {projects: $relations}}')

          # The tag goes up BEFORE the upload and comes back down if the upload fails. The other way round, an
          # upload whose tag then failed to push got uploaded a second time by the next run, and a duplicate on
          # CurseForge can only be removed by hand; a failed upload with its tag removed just needs a new run.
          git tag "$tag"
          git push origin "$tag"

          echo "Uploading $jar to CurseForge as a $RELEASE_TYPE for $LOADER_NAME $MC"
          if ! curl -sS --fail-with-body -X POST \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form-string "metadata=$metadata" -F "file=@$jar"; then
            echo
            echo "::error::The upload to CurseForge failed; removing tag $tag so a new run uploads it."
            git push --delete origin "$tag" \
              || echo "::error::Could not delete tag $tag: delete it by hand before running again."
            exit 1
          fi
          echo
