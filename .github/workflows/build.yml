name: Build

# One branch per Minecraft version (NeoFabric/1.21.1, NeoFabric/26.1.2...),
# each building every loader it supports. This file reads the versions from
# gradle.properties, so it is the same on every branch.
on:
  push:
    branches:
      - "NeoFabric/**"
      - "Fabric/**"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches:
      - "NeoFabric/**"
      - "Fabric/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.gradle_props.outputs.mod_version }}
      minecraft_version: ${{ steps.gradle_props.outputs.minecraft_version }}
      loaders: ${{ steps.loaders.outputs.loaders }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Must match java_version in gradle.properties. If it doesn't, foojay
      # downloads the right JDK mid-build: it works, but it re-downloads every
      # run and turns an outage in someone else's service into a failed build.
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read mod properties
        id: gradle_props
        run: |
          set -euo pipefail
          for key in mod_version minecraft_version; do
            value=$(grep -E "^$key=" gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
            [ -n "$value" ] || { echo "$key not found in gradle.properties"; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      # The loaders this branch builds are the loader modules it has, so a
      # Fabric-only branch (Fabric/1.20.1) needs no edit here.
      - name: Detect loaders
        id: loaders
        run: |
          set -euo pipefail
          loaders=()
          for loader in fabric neoforge; do
            [ -f "$loader/build.gradle" ] && loaders+=("\"$loader\"")
          done
          [ ${#loaders[@]} -gt 0 ] || { echo "No loader module found"; exit 1; }
          echo "loaders=[$(IFS=,; echo "${loaders[*]}")]" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build

      # Named exactly, like in release.yml: a glob would also pick up a
      # sources or javadoc jar the day the build starts producing one.
      - name: Collect jars
        env:
          MOD_VERSION: ${{ steps.gradle_props.outputs.mod_version }}
          MC: ${{ steps.gradle_props.outputs.minecraft_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for loader in fabric neoforge; do
            [ -f "$loader/build.gradle" ] || continue
            cp "$loader/build/libs/borderlesswindow-$loader-$MOD_VERSION+mc$MC.jar" dist/
          done
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: borderlesswindow-dev
          path: dist/*.jar
          retention-days: 14
          if-no-files-found: error

  # Publishes the jars to CurseForge only when the pushed commit message contains [curseforge], optionally with a
  # release type: [curseforge], [curseforge beta] or [curseforge alpha]. One upload per loader. The changelog is the
  # English part of changelogs/changelog-<version>.md or, without it, the body of the commit message. Needs the
  # CURSEFORGE_TOKEN secret and the CURSEFORGE_PROJECT_ID variable of the repository. It is its own job so only it gets
  # write access.
  publish-curseforge:
    needs: build
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[curseforge') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the curseforge-* tags
    strategy:
      # Each loader uploads on its own: one failing must not cancel the other,
      # and a re-run then only uploads what is missing (see the tag check).
      fail-fast: false
      matrix:
        loader: ${{ fromJSON(needs.build.outputs.loaders) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: borderlesswindow-dev
          path: dist

      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MOD_VERSION: ${{ needs.build.outputs.mod_version }}
          MC: ${{ needs.build.outputs.minecraft_version }}
          LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail
          : "${CURSEFORGE_TOKEN:?Add the CURSEFORGE_TOKEN secret to the repository}"
          : "${CURSEFORGE_PROJECT_ID:?Add the CURSEFORGE_PROJECT_ID variable to the repository}"

          case "$LOADER" in
            fabric)   LOADER_NAME=Fabric ;;
            neoforge) LOADER_NAME=NeoForge ;;
            *) echo "Unknown loader $LOADER"; exit 1 ;;
          esac

          RELEASE_TYPE=release
          if [[ "$COMMIT_MESSAGE" =~ \[curseforge\ (alpha|beta|release)\] ]]; then RELEASE_TYPE="${BASH_REMATCH[1]}"; fi

          # The English part of changelogs/changelog-<version>.md (from the first "## " heading up to the "---" or
          # <details> before the Spanish notes; CurseForge already shows the version and date), else the commit
          # message without its first line and without the [curseforge] markers, else a plain line
          CHANGELOG=""
          file="changelogs/changelog-$MOD_VERSION.md"
          if [ -f "$file" ]; then
            CHANGELOG=$(awk '/^---[[:space:]]*$/ || /^<details>/{ exit } /^## /{ found=1 } found' "$file")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(printf '%s\n' "$COMMIT_MESSAGE" | tail -n +2 | sed -E 's/\[curseforge[^]]*\]//g' | sed '/./,$!d')
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="Borderless Window $MOD_VERSION for $LOADER_NAME $MC."

          # A version that is already on CurseForge (marked with a tag once it was uploaded) is not uploaded again.
          # The loader is part of the tag, so each loader's file is tracked on its own.
          tag="curseforge-$LOADER-$MC-$MOD_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$LOADER_NAME $MC $MOD_VERSION is already on CurseForge (tag $tag), not uploading it again"
            exit 0
          fi

          jar="dist/borderlesswindow-$LOADER-$MOD_VERSION+mc$MC.jar"
          # "Borderless Window NeoForge 1.21.1 1.9.0": loader and Minecraft version up front, so every file is unique
          # across releases and branches -- each branch uploads the same mod version for its own Minecraft version.
          name="Borderless Window $LOADER_NAME $MC-$MOD_VERSION"

          # Client only: the mod has no server side, so "Server" is deliberately not listed
          metadata=$(jq -nc \
            --arg changelog "$CHANGELOG" \
            --arg type "$RELEASE_TYPE" \
            --arg name "$name" \
            --arg mc "$MC" \
            --arg loader "$LOADER_NAME" \
            '{changelog: $changelog, changelogType: "markdown", releaseType: $type, displayName: $name,
              gameVersionNames: [$mc, $loader, "Client"]}')

          echo "Uploading $jar to CurseForge as a $RELEASE_TYPE for $LOADER_NAME $MC"
          curl -sS --fail-with-body -X POST \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form-string "metadata=$metadata" -F "file=@$jar"
          echo
          git tag "$tag"
          git push origin "$tag"
