name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. Only the job that creates the release can write, so
# the build -- Gradle, its plugins and every dependency it downloads -- never
# runs with a token that can change the repository. Actions are pinned by
# commit SHA (see build.yml).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.verify.outputs.mod_version }}
      mc_version: ${{ steps.verify.outputs.mc_version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      # Both pre-flight checks run BEFORE the build: a wrong version or a
      # missing changelog should fail in twenty seconds, not in four minutes.

      # The tag carries both numbers: v1.9.0+mc1.21.1. The mod version is what
      # ends up inside the jars, and the Minecraft version is what tells the
      # branches apart -- tagging from the wrong branch is otherwise invisible
      # until someone downloads it.
      - name: Verify tag matches this branch
        id: verify
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME#v}"

          case "$REF" in
            *+mc*) ;;
            *) echo "::error::The tag must look like v<mod_version>+mc<minecraft_version>, e.g. v1.9.0+mc1.21.1."; exit 1 ;;
          esac

          TAG_MOD="${REF%%+*}"
          TAG_MC="${REF#*+mc}"

          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')

          echo "tag: $TAG_MOD / mc $TAG_MC | gradle.properties: $MOD_VERSION / mc $MC_VERSION"

          if [ "$TAG_MOD" != "$MOD_VERSION" ]; then
            echo "::error::The tag says mod $TAG_MOD but gradle.properties says $MOD_VERSION."
            exit 1
          fi
          if [ "$TAG_MC" != "$MC_VERSION" ]; then
            echo "::error::The tag says Minecraft $TAG_MC but this branch builds for $MC_VERSION. Wrong branch?"
            exit 1
          fi

          # A hyphen in the MOD version marks a prerelease. The '+mc' suffix
          # must not be read as one.
          case "$TAG_MOD" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac

          {
            echo "mod_version=$TAG_MOD"
            echo "mc_version=$TAG_MC"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "MOD_VERSION=$TAG_MOD" >> "$GITHUB_ENV"
          echo "MC_VERSION=$TAG_MC"   >> "$GITHUB_ENV"

      # One changelog file per version means the whole file IS the release body
      # -- nothing to slice out of a growing document.
      - name: Locate this version's changelog
        run: |
          set -euo pipefail
          NOTES="changelogs/changelog-${MOD_VERSION}.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing or empty. Write the changelog for this version before tagging it."
            exit 1
          fi
          echo "NOTES_PATH=$NOTES" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      # One jar per loader module this branch has, named exactly: a glob such
      # as */build/libs/*.jar would also pick up common/'s jar, or a sources
      # or javadoc jar the day the build starts producing one. The release
      # notes travel with them, so the release job needs no checkout.
      - name: Collect jars and notes
        run: |
          set -euo pipefail
          mkdir -p dist
          found=0
          for loader in fabric neoforge; do
            [ -f "$loader/build.gradle" ] || continue
            cp "$loader/build/libs/borderlesswindow-$loader-$MOD_VERSION+mc$MC_VERSION.jar" dist/
            found=1
          done
          [ "$found" = 1 ] || { echo "::error::No loader module found."; exit 1; }
          cp "$NOTES_PATH" dist/release-notes.md
          ls -l dist

      - name: Upload jars and notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - name: Download jars and notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Borderless Window v${{ needs.build.outputs.mod_version }} — Minecraft ${{ needs.build.outputs.mc_version }}
          body_path: dist/release-notes.md
          prerelease: ${{ needs.build.outputs.prerelease }}
          files: dist/*.jar
          # Without this, a build that produced no jar publishes an empty
          # release instead of failing.
          fail_on_unmatched_files: true
