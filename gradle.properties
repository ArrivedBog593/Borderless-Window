# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## Environment Properties
# This branch builds for one Minecraft version, for every loader in it.
# Must match java.toolchain in buildSrc and the JDK in the workflows.
java_version=21
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.11
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.11]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.11.48
# The Neo version range can use any version of Neo as bounds
neo_version_range=[21,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[10,)
# The plain Minecraft that common/ compiles against: no loader API in sight,
# so anything loader-specific there fails to compile instead of failing on
# the other loader at runtime. Must be the NeoForm that neo_version uses.
neo_form_version=1.21.11-20251209.172050
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20
## Fabric
# The loader the jar is built against and the dev run uses: kept at the
# newest, or a mod in the run's mods/ folder may need a newer one than
# the dev run has. Any loader from 0.17.3 runs the jar itself (the
# oldest the bundled Fabric API modules accept).
fabric_loader_version=0.20.1
fabric_loader_requirement=>=0.17.3
# Optional integrations: compiled against, never bundled nor required.
modmenu_version=17.0.1
# Only to pick the Fabric API modules bundled in the jar (see
# fabric/build.gradle); Fabric API itself is not a dependency.
fabric_api_version=0.141.6+1.21.11
## Shared dependencies
# The MixinExtras bundled by NeoForge 21.11; common/ only needs its annotations.
mixin_extras_version=0.5.3
# Sodium publishes one API jar per loader and none shared; common/ compiles
# against the NeoForge one, which uses the same Mojang names as common/.
sodium_api_version=0.8.14+mc1.21.11
## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=borderlesswindow
# The human-readable display name for the mod.
mod_name=Borderless Window
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.11.2
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.github.arrivedbog593
# The authors of the mod. This is a simple text string used for display purposes in the mod list.
mod_authors=ArrivedBog593
# The description of the mod. This is a simple multiline text string used for display purposes in the mod list.
# Written by CATEGORY, not feature by feature: the categories match the config
# sections, so adding an option inside an existing one needs no edit here.
mod_description=Adds borderless fullscreen to Minecraft with a 3-mode system (Windowed / Borderless / Fullscreen) and configurable F11 behavior, plus a growing set of video and quality-of-life options Minecraft doesn't expose. Every setting defaults to vanilla behavior. Configurable from Minecraft's own Video Settings, with optional Sodium integration. Nothing else to install.
